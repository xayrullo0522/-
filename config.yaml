# =====================================================================
#  SOZLAMALAR — shu faylni o'z saytingizga moslab o'zgartirasiz.
#  Selektorlarni topish uchun:  python mahalla_bot.py --tanlash
#  (ALT + sichqoncha bosish -> tayyor qatorni shu yerga ko'chirasiz)
# =====================================================================

sayt:
  # Dastur ochganda birinchi kiradigan manzil
  kirish_url: "https://online-mahalla.uz/tables/survey_homes_street?obl_id=33&area_id=3306&district_id=3306020&street_id=330600447&_mid=3548"

# =====================================================================
#  XONADONLAR BO'YICHA ISHLASH
#  Ro'yxat sahifasidagi har bir xonadon (kadastr raqami) ochiladi va
#  Excel'da shu kadastrga yozilgan odamlar (7-8 ta) bittadan kiritiladi.
#  Bu bo'limni o'chirsangiz — har bir Excel qatori alohida kiritiladi.
# =====================================================================
guruhlash:
  ustun: "TV_ALP_CADASTRE"      # Excel'dagi xonadon (kadastr) ustuni
  royxat_url: "https://online-mahalla.uz/tables/survey_homes_street?obl_id=33&area_id=3306&district_id=3306020&street_id=330600447&_mid=3548"
  royxatdan_olish: true         # faqat ro'yxat sahifasida bor xonadonlar olinadi (butun tuman emas)
  keyingi_sahifa_selector: null # ro'yxat bir necha sahifali bo'lsa: "keyingi sahifa" tugmasi, masalan "li.next a"
  max_odam: 0                   # bitta xonadonga ko'pi bilan nechta odam (0 = cheklanmagan)
  har_odamda_qayta_ochish: false  # true = har bir odamdan oldin xonadon qaytadan ochiladi

  # Xonadonni ochish qadamlari ({TV_ALP_CADASTRE} — shu xonadonning kadastr raqami)
  xonadon_qadamlar:
    - amal: ochish
      url: "https://online-mahalla.uz/tables/survey_homes_street?obl_id=33&area_id=3306&district_id=3306020&street_id=330600447&_mid=3548"
    - amal: bosish
      selector: 'text="{TV_ALP_CADASTRE}"'

excel:
  fayl: "Yangi_Pasport_Stol_4_5.xlsx"   # ma'lumotlar fayli (dastur papkasida). Bu fayl o'zgartirilmaydi.
  varaq: "Лист1"                        # varaq nomi; null = birinchi varaq
  sarlavha_qatori: 1                    # ustun nomlari qaysi qatorda (0 = sarlavha yo'q, ustunlar A, B, C...)
  natija_fayl: null                     # null = "<fayl>_natija.xlsx" — har bir qator holati (OK / XATO) shu yerga yoziladi
  korsatish_ustunlari: ["TV_SURNAMELATIN", "TV_NAMELATIN", "TV_PINPP"]   # ekranda va natija faylida ko'rsatish uchun
  jshshir_ustuni: "TV_PINPP"            # shundan "JINS" ustuni hisoblanadi (Erkak / Ayol)

  # Faqat kerakli fuqarolarni olish (faylda butun tuman bor — 124 000+ qator).
  # Ustunda shu matn bo'lsa olinadi (katta-kichik harf farqi yo'q). Bir necha variant: ["a", "b"]
  # filtr:
  #   TV_ALP_ADDRESS: "Г.ГУЛОМ"
  #   TV_ALP_CADASTRE: "22:10:01:01:01:0011"

# Excel ustunlari (Лист1):
#   TV_PINPP (JSHSHIR), TV_SURNAMECIRILLIC, TV_NAMECIRILLIC, TV_PATRONYMCIRILLIC,
#   TV_SURNAMELATIN, TV_NAMELATIN, TV_PATRONYMLATIN, TV_DATEBIRTH, TV_BIRTHPLACELATIN,
#   TV_SERIALNUMBER (pasport), TV_ALP_CADASTRE, TV_ALP_ADDRESS, TV_REGISTRATIONDATE,
#   JINS (dastur hisoblaydi)

brauzer:
  kanal: "chrome"               # kompyuterdagi Google Chrome; "msedge" ham bo'ladi
  profil_papkasi: "brauzer_profil"   # login saqlanib qoladi
  kutish_soniya: 15             # element chiqishini maksimal kutish
  qadamlar_orasi: 0.3           # har bir harakat orasidagi pauza (soniya)
  qatorlar_orasi: 1.0           # har bir fuqaro orasidagi pauza (soniya)
  xatoda_toxtash: false         # true = xato bo'lsa to'xtab, sizdan so'raydi
  sekinlashtirish_ms: 0         # kuzatish uchun hamma harakatlarni sekinlashtirish

# =====================================================================
#  QADAMLAR — har bir Excel qatori (fuqaro) uchun ketma-ket bajariladi.
#
#  amal turlari:
#    ochish     — url ga o'tish                      (url)
#    bosish     — tugma/havolani bosish               (selector)
#    yozish     — matn maydoniga yozish               (selector, ustun | qiymat)
#                   sekin: true  — maskali maydonlar (sana, telefon) uchun
#                   enter: true / tab: true — yozgandan keyin bosish
#    tanlash    — oddiy <select> ro'yxatidan tanlash  (selector, ustun)
#    royxat     — maxsus ochiluvchi ro'yxat           (selector, ustun, [variant_selector])
#                   yozib_qidirish: true — ochilgach qiymatni yozib qidiradi
#    belgilash  — checkbox/radio                       (selector, [ustun: ha/yo'q])
#    fayl       — fayl yuklash                         (selector, ustun = fayl yo'li)
#    tugma      — klaviatura tugmasi                   (tugma: Enter / Escape / Tab)
#    kutish     — element chiqishini kutish            (selector | url | holat)
#    pauza      — oddiy kutish                         (soniya)
#    tekshirish — selector ko'rinsa XATO deb belgilash (masalan xato xabari)
#    qolda      — siz qo'lda biror ish qilasiz         (xabar)
#
#  Umumiy parametrlar:
#    ustun:   "Excel ustun nomi"   — qiymat shu ustundan olinadi
#    qiymat:  "matn {Ustun}"       — doimiy yoki shablon qiymat
#    format:  "%d.%m.%Y"           — sanalar uchun format
#    almashtirish: {"E": "Erkak"}  — Excel qiymatini sayt qiymatiga almashtirish
#    majburiy: false               — xato bo'lsa ham davom etadi
#    saqlash: true                 — --tekshir rejimida shu qadamdan oldin so'raydi
#    kutish_soniya: 30             — shu qadam uchun alohida kutish
#
#  Selektor: CSS (#id, input[name="x"]), XPath (//button[...]) yoki text=Saqlash
#
#  QUYIDAGILAR — NAMUNA. Eng oson yo'li — yozib olish rejimi:
#      python mahalla_bot.py --yozib_olish
#  (bitta xonadonni ochib, bitta odamni qo'lda kiritasiz — dastur config_yozilgan.yaml ni o'zi yaratadi)
# =====================================================================

# Bitta odamni kiritish qadamlari (xonadon ochiq turganda bajariladi)
qadamlar:
  # 1) Xonadonga odam qo'shish formasini ochish
  - amal: bosish
    selector: "text=Qo'shish"

  # 2) Maydonlarni to'ldirish (selektorlar — taxminiy, yozib olish rejimida aniqlanadi)
  - amal: yozish
    selector: "input[name='pinfl']"
    ustun: "TV_PINPP"

  - amal: yozish
    selector: "input[name='passport']"
    ustun: "TV_SERIALNUMBER"

  - amal: yozish
    selector: "input[name='lastName']"
    ustun: "TV_SURNAMELATIN"

  - amal: yozish
    selector: "input[name='firstName']"
    ustun: "TV_NAMELATIN"

  - amal: yozish
    selector: "input[name='middleName']"
    ustun: "TV_PATRONYMLATIN"

  - amal: yozish
    selector: "input[name='birthDate']"
    ustun: "TV_DATEBIRTH"
    sekin: true

  - amal: tanlash
    selector: "select[name='gender']"
    ustun: "JINS"
    # saytda boshqacha yozilgan bo'lsa:  almashtirish: {"Erkak": "Эркак", "Ayol": "Аёл"}

  # 3) Saqlash
  - amal: bosish
    selector: "text=Saqlash"
    saqlash: true

  # 4) Natijani tekshirish: xato xabari chiqsa — XATO
  - amal: pauza
    soniya: 1
  - amal: tekshirish
    selector: ".error-message, .alert-danger, .ant-message-error, .invalid-feedback"
